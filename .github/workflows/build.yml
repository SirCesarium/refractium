name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            asset: refractium-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: refractium-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            asset: refractium-windows-amd64
            exe: .exe
          - target: aarch64-pc-windows-msvc
            os: windows-2025
            asset: refractium-windows-arm64
            exe: .exe
          - target: aarch64-apple-darwin
            os: macos-26
            asset: refractium-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Build binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin refractium

      - name: Stage archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p _packages
          cp "target/${{ matrix.target }}/release/refractium" refractium
          tar -czf "_packages/${{ matrix.asset }}.tar.gz" refractium

      - name: Stage archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _packages | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/refractium.exe" refractium.exe
          Compress-Archive -Path refractium.exe -DestinationPath "_packages/${{ matrix.asset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: _packages/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: true

      - name: Verify tag matches crate version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "refractium") | .version')
          tag="${GITHUB_REF_NAME#v}"

          if [ "$tag" != "$version" ]; then
            echo "error: tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "refractium") | .version')

          if curl -fsS -A "refractium-release-ci" \
            "https://crates.io/api/v1/crates/refractium/$version" > /dev/null; then
            echo "refractium $version is already on crates.io, skipping"
          else
            cargo publish --locked
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./artifacts

      - name: List artifacts
        shell: bash
        run: find ./artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: ./artifacts/*
          generate_release_notes: true

  docker:
    name: Publish container image
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sircesarium/refractium
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: refractium-linux-*
          merge-multiple: true
          path: ./dist

      - name: Prepare build contexts
        shell: bash
        run: |
          for arch in amd64 arm64; do
            dir="context/$arch"
            mkdir -p "$dir"
            tar -xzf "dist/refractium-linux-$arch.tar.gz" -C "$dir"
            cat > "$dir/Dockerfile" <<'EOF'
          FROM gcr.io/distroless/cc-debian13:nonroot
          WORKDIR /app
          COPY refractium /app/refractium
          ENTRYPOINT ["/app/refractium"]
          EOF
            ls -l "$dir"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: context/amd64
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-amd64

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: context/arm64
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-arm64

      - name: Publish multi-arch manifest
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

          docker buildx imagetools inspect "${IMAGE}:${TAG}"
